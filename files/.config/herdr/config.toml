onboarding = false

[ui]
agent_panel_sort = "priority"

[keys]
help = ["prefix+?", "ctrl+alt+?"]
settings = ["prefix+s", "ctrl+alt+s"]
new_workspace = ["prefix+shift+n", "ctrl+alt+shift+n"]
new_worktree = ["prefix+shift+g", "ctrl+alt+shift+g"]
rename_workspace = ["prefix+shift+w", "ctrl+alt+shift+w"]
close_workspace = ["prefix+shift+d", "ctrl+alt+shift+d"]
workspace_picker = ["prefix+w", "ctrl+alt+w"]
previous_agent = "ctrl+alt+up"
next_agent = "ctrl+alt+down"
goto = ["prefix+g", "ctrl+alt+g"]
detach = ["prefix+q", "ctrl+alt+q"]
reload_config = ["prefix+shift+r", "ctrl+alt+shift+r"]
open_notification_target = ["prefix+o", "ctrl+alt+o"]
new_tab = ["prefix+c", "ctrl+alt+c"]
rename_tab = ["prefix+shift+t", "ctrl+alt+shift+t"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
next_tab = ["prefix+n", "ctrl+alt+n"]
switch_tab = ["prefix+1..9", "ctrl+alt+1..9"]
close_tab = ["prefix+shift+x", "ctrl+alt+shift+x"]
rename_pane = ["prefix+shift+p", "ctrl+alt+shift+p"]
edit_scrollback = ["prefix+e", "ctrl+alt+e"]
copy_mode = ["prefix+[", "ctrl+alt+["]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
swap_pane_left = ["prefix+shift+h", "ctrl+alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "ctrl+alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "ctrl+alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "ctrl+alt+shift+l"]
cycle_pane_next = ["prefix+tab", "ctrl+alt+tab"]
cycle_pane_previous = ["prefix+shift+tab", "ctrl+alt+shift+tab"]
split_vertical = ["prefix+=", "ctrl+alt+="]
split_horizontal = ["prefix+minus", "ctrl+alt+minus"]
close_pane = ["prefix+x", "ctrl+alt+x"]
zoom = ["prefix+z", "ctrl+alt+z"]
resize_mode = ["prefix+r", "ctrl+alt+r"]
toggle_sidebar = ["prefix+b", "ctrl+alt+b"]

[[keys.command]]
key = "ctrl+alt+v"
type = "plugin_action"
command = "local.vscode-workspace.open"
description = "open workspace in VS Code"

[theme]
name = "nord"
auto_switch = false
