packages:
  apt:
    prerequisites:
      - ca-certificates
      - curl
      - gnupg
    packages:
      - bash-completion
      - gh
      - git
      - kustomize
      - ripgrep
      - tmux
      - unzip
      - zsh
  kubernetes:
    minor: v1.35
  gitRepositories:
    - name: Oh My Zsh
      url: https://github.com/ohmyzsh/ohmyzsh.git
      destination: .oh-my-zsh
      marker: oh-my-zsh.sh
  installScripts:
    bun:
      url: https://bun.sh/install
    pnpm:
      url: https://get.pnpm.io/install.sh
  npmGlobals:
    - "@earendil-works/pi-coding-agent"
    - "@openai/codex"
    - portless
